[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payflow"
version = "0.1.0"
description = "Production-inspired, event-driven payment processing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0,<2",
  "aiokafka>=0.12.0,<1",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.115.0,<1",
  "pydantic-settings>=2.7.0,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1",
  "httpx>=0.28.0,<1",
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.9.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
